services:
  - type: web
    name: diecast-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/sync_to_postgres.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diecast-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0

databases:
  - name: diecast-db
    plan: free
